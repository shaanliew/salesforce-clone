name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test
        run: |
          npm start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000/login && break; sleep 1; done
          login=$(curl -s -o /tmp/login.html -w '%{http_code}' http://localhost:3000/login)
          home=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:3000/accounts)
          echo "GET /login -> $login"; echo "GET /accounts -> $home"
          test "$login" = "200"
          grep -q 'Nimbus CRM' /tmp/login.html
          case "$home" in 307*/login*) ;; *) echo "expected redirect to /login"; cat server.log; exit 1;; esac
